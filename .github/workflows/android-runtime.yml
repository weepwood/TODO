name: Android 正式签名包隔离升级验收（研究分支）
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-android-upgrade:
    if: github.ref == 'refs/heads/research/signed-upgrade-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45867313963
          name: signed-android
          path: ${{ runner.temp }}/todo-android-alpha.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45938395961
          name: signed-android
          path: ${{ runner.temp }}/todo-android-alpha.2
      - name: Verify original Android signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TODO_VERIFY_ANDROID_PIN: ${{ vars.TODO_ANDROID_CERT_SHA256 }}
        run: node scripts/verify-signed-upgrade-assets.mjs android
      - name: Enable KVM on disposable hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual signed APK upgrade conditional on ABI support
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/verify-signed-android-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-android-upgrade-evidence
          path: android-upgrade-evidence/
          retention-days: 7
          if-no-files-found: warn
