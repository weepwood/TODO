[package]
name = "todo"
version = "1.2.0-alpha.1"
description = "TODO personal task workbench"
edition = "2024"
default-run = "todo"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
tauri-plugin-notification = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", features = ["v4"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-todo-mobile = { path = "plugins/todo-mobile" }
