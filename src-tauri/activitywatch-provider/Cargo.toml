[package]
name = "todo-activitywatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
reqwest = { version = "=0.13.5", default-features = false }
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "net"] }
