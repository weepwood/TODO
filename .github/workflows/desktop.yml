name: 隔离签名安装包升级验收（研究分支）
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-upgrade:
    if: false # previous successful evidence 45991971602; not repeated
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify original successful signing runs and artifact identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content scripts/signed-windows-upgrade-pins.json -Raw | ConvertFrom-Json
          foreach ($pin in $pins) {
            $run = gh api "repos/weepwood/TODO/actions/runs/$($pin.runId)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $pin.sha -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/signed-release.yml') {
              throw 'Original signing run identity or conclusion mismatch'
            }
            $artifact = gh api "repos/weepwood/TODO/actions/artifacts/$($pin.artifactId)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $artifact.id -ne $pin.artifactId -or $artifact.expired -or $artifact.name -ne 'signed-windows' -or $artifact.workflow_run.id -ne $pin.runId) {
              throw 'Original signed artifact identity mismatch'
            }
            Write-Host "Verified original signing run $($pin.runId), artifact $($pin.artifactId)"
          }
      - name: Download Alpha.1 original signed artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45867313963
          name: signed-windows
          path: ${{ runner.temp }}/todo-original-alpha.1
      - name: Download Alpha.2 original signed artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45938395961
          name: signed-windows
          path: ${{ runner.temp }}/todo-original-alpha.2
      - name: Real Windows NSIS overlay and native CLI/SQLite verification
        env:
          TODO_VERIFY_PUBLIC_KEY: ${{ vars.TODO_UPDATER_PUBLIC_KEY }}
        run: node scripts/verify-signed-windows-upgrade.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-windows-upgrade-evidence
          path: signed-upgrade-evidence/
          retention-days: 7
          if-no-files-found: warn

  mac-upgrade:
    if: github.ref == 'refs/heads/research/signed-upgrade-20261127'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45867313963
          name: signed-mac
          path: ${{ runner.temp }}/todo-mac-alpha.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45938395961
          name: signed-mac
          path: ${{ runner.temp }}/todo-mac-alpha.2
      - name: Verify original Mac signing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TODO_VERIFY_PUBLIC_KEY: ${{ vars.TODO_UPDATER_PUBLIC_KEY }}
        run: node scripts/verify-signed-upgrade-assets.mjs mac
      - name: Real DMG installation and native queue overlay
        run: python3 scripts/verify-signed-mac-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-mac-upgrade-evidence
          path: mac-upgrade-evidence/
          retention-days: 7
          if-no-files-found: warn
